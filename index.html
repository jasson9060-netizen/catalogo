    <title>Catálogo Digital - Studio Vivencia</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none; /* Evita selección de texto */
        }
        
        /* Mensaje indicador superior */
        #hint {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            pointer-events: none;
            text-align: center;
        }

        /* Leyenda de derechos Studio Vivencia */
        #watermark-footer {
            color: #777;
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: center;
            text-transform: uppercase;
        }

        #book-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #book {
            width: 90vw;
            height: 78vh;
            max-width: 1000px;
            max-height: 700px;
        }
        
        .page {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Capa invisible para bloquear clic derecho y descargas */
        .page::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Botones de navegación laterales */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            font-size: 24px;
            padding: 15px 12px;
            cursor: pointer;
            z-index: 100;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.8);
            color: black;
        }

        #prev-btn { left: -50px; }
        #next-btn { right: -50px; }

        @media (max-width: 768px) {
            #prev-btn { left: 5px; }
            #next-btn { right: 5px; }
            #hint { font-size: 11px; }
            #watermark-footer { font-size: 10px; }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        window.addEventListener('load', function() {
            const bookElement = document.getElementById("book");
            const pageFlip = new St.PageFlip(bookElement, {
                width: 500,
                height: 700,
                size: "stretch",
                minWidth: 300,
                maxWidth: 1000,
                minHeight: 400,
                maxHeight: 1000,
                maxShadowOpacity: 0.5,
                showCover: true,
                mobileScrollSupport: true
            });
            
            pageFlip.loadFromHTML(document.querySelectorAll(".page"));

            // Control de flechas laterales
            document.getElementById("prev-btn").addEventListener("click", () => {
                pageFlip.flipPrev();
            });

            document.getElementById("next-btn").addEventListener("click", () => {
                pageFlip.flipNext();
            });
        });
    </script>
