<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital - Studio Vivencia</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        
        #hint {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            pointer-events: none;
            text-align: center;
        }

        #watermark-footer {
            color: #777;
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: center;
            text-transform: uppercase;
        }

        #book-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #book {
            width: 90vw;
            height: 78vh;
            max-width: 1000px;
            max-height: 700px;
        }
        
        .page {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .page::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Botones de navegación laterales */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            font-size: 24px;
            padding: 15px 12px;
            cursor: pointer;
            z-index: 100;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.8);
            color: black;
        }

        #prev-btn { left: -50px; }
        #next-btn { right: -50px; }

        /* Botón flotante de WhatsApp */
        #whatsapp-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #25d366;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 1000;
            transition: transform 0.2s, background-color 0.2s;
        }

        #whatsapp-btn:hover {
            background-color: #20ba5a;
            transform: scale(1.05);
        }

        #whatsapp-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        @media (max-width: 768px) {
            #prev-btn { left: 5px; }
            #next-btn { right: 5px; }
            #hint { font-size: 11px; }
            #watermark-footer { font-size: 10px; }
            #whatsapp-btn { bottom: 15px; right: 15px; padding: 10px
