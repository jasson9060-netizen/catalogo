<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #book {
            width: 90vw;
            height: 90vh;
            max-width: 1000px;
            max-height: 700px;
        }
        .page {
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <div id="book"></div>

    <!-- Librería PageFlip desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const bookElement = document.getElementById("book");
            
            const totalPages = 42;
            // Nombre base con los caracteres codificados para la web (espacios y paréntesis)
            const prefix = "Presentación%20Portfolio%20Creativo%20Agencia%20de%20Publicidad%20Marketing%20Minimalista%20Rosa%20Rojo%20(1)_pages-to-jpg-";
            
            for (let i = 1; i <= totalPages; i++) {
                let numStr = String(i).padStart(4, '0');
                let filename = prefix + numStr + ".jpg";
                
                let pageDiv = document.createElement("div");
                pageDiv.className = "page";
                pageDiv.style.backgroundImage = `url('${filename}')`;
                bookElement.appendChild(pageDiv);
            }

            const pageFlip = new St.PageFlip(bookElement, {
                width: 500,
                height: 700,
                size: "stretch",
                minWidth: 300,
                maxWidth: 1000,
                minHeight: 400,
                maxHeight: 1000,
                maxShadowOpacity: 0.5,
                showCover: true,
                mobileScrollSupport: true
            });

            pageFlip.loadFromHTML(document.querySelectorAll(".page"));
        });
    </script>
</body>
</html>
