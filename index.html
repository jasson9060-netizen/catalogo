    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
        }

        /* Contenedor optimizado para el logo de 300x150 px sin bordes sobrantes */
        #logo-container {
            width: 100%;
            max-width: 280px;
            height: 85px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        #header-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        
        #hint {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            pointer-events: none;
            text-align: center;
        }

        /* Indicador de página actual en vivo */
        #page-indicator {
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 10px;
            border-radius: 12px;
        }

        #watermark-footer {
            color: #888;
            font-size: 11px;
            margin-top: 4px;
            margin-bottom: 2px;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: center;
            text-transform: uppercase;
        }

        #book-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #book {
            width: 90vw;
            height: 65vh;
            max-width: 1000px;
            max-height: 600px;
        }
        
        .page {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Capa transparente anti-guardado de imágenes */
        .page::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Botones de navegación laterales */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            font-size: 24px;
            padding: 15px 12px;
            cursor: pointer;
            z-index: 100;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.8);
            color: black;
        }

        #prev-btn { left: -50px; }
        #next-btn { right: -50px; }

        /* Botón flotante de WhatsApp */
        #whatsapp-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #25d366;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            display: none;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 1000;
            transition: transform 0.2s, background-color 0.2s;
        }

        #whatsapp-btn:hover {
            background-color: #20ba5a;
            transform: scale(1.05);
        }

        #whatsapp-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Contenedor fijo para el botón de reinicio */
        #restart-container {
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 2px;
        }

        #restart-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background 0.2s;
            display: none;
        }

        #restart-btn:hover {
            background-color: #ff6b81;
        }

        @media (max-width: 768px) {
            #prev-btn { left: 5px; }
            #next-btn { right: 5px; }
            #logo-container { max-width: 220px; height: 70px; }
            #hint { font-size: 10px; }
            #watermark-footer { font-size: 9px; }
            #page-indicator { font-size: 10px; }
            #whatsapp-btn { bottom: 15px; right: 15px; padding: 10px 16px; font-size: 13px; }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
        window.addEventListener('load', function() {
            const bookElement = document.getElementById("book");
            const pageFlip = new St.PageFlip(bookElement, {
                width: 500,
                height: 700,
                size: "stretch",
                minWidth: 300,
                maxWidth: 1000,
                minHeight: 400,
                maxHeight: 1000,
                maxShadowOpacity: 0.5,
                showCover: true,
                mobileScrollSupport: true
            });
            
            pageFlip.loadFromHTML(document.querySelectorAll(".page"));
            const totalPages = 42;

            function updateUI(pageIndex) {
                const realPageNum = pageIndex + 1;
                
                // Actualizar texto del número de página
                document.getElementById("page-indicator").innerText = `Página ${realPageNum} de ${totalPages}`;

                // Configurar enlace y mensaje de WhatsApp
                const phoneNumber = "525514998843";
                let message = "";

                if (realPageNum === 41) {
                    message = `Hola Studio Vivencia, estoy viendo la página 41 de credenciales y me gustaría saber qué color de cordón hay disponible para mi pedido.`;
                } else {
                    message = `Hola Studio Vivencia, estoy viendo su catálogo digital y me interesa el modelo de la página ${realPageNum}.`;
                }

                const encodedMessage = encodeURIComponent(message);
                const waBtn = document.getElementById("whatsapp-btn");
                waBtn.href = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

                // Mostrar botón de WhatsApp solo desde la página 3 hasta la 41
                if (pageIndex >= 2 && realPageNum < totalPages) {
                    waBtn.style.display = "flex";
                } else {
                    waBtn.style.display = "none";
                }

                // Controlar el botón de reinicio en la página 42
                const restartBtn = document.getElementById("restart-btn");
                if (realPageNum === totalPages) {
                    restartBtn.style.display = "inline-block";
                } else {
                    restartBtn.style.display = "none";
                }
            }

            // Inicializar en la página 1
            updateUI(0);

            // Escuchar cambios de página
            pageFlip.on('flip', (e) => {
                updateUI(e.data);
            });

            // Control de flechas laterales
            document.getElementById("prev-btn").addEventListener("click", () => {
                pageFlip.flipPrev();
            });

            document.getElementById("next-btn").addEventListener("click", () => {
                pageFlip.flipNext();
            });

            // Botón para volver al inicio
            document.getElementById("restart-btn").addEventListener("click", () => {
                pageFlip.turnToPage(0);
            });
        });
    </script>
