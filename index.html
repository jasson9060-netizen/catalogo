<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Catálogo Digital</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
    }
    .page {
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #ffffff;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="book">
    <!-- Coloca una línea por cada imagen que subiste -->
    <div class="page" style="background-image: url('1.jpg');"></div>
    <div class="page" style="background-image: url('2.jpg');"></div>
    <div class="page" style="background-image: url('3.jpg');"></div>
    <div class="page" style="background-image: url('4.jpg');"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const pageFlip = new St.PageFlip(document.getElementById('book'), {
      width: 400,
      height: 600,
      size: 'stretch',
      minWidth: 300,
      maxWidth: 1000,
      minHeight: 400,
      maxHeight: 1350,
      maxShadowOpacity: 0.5,
      showCover: true,
      mobileScrollSupport: false
    });

    pageFlip.loadFromHTML(document.querySelectorAll('.page'));
  });
</script>
</body>
</html>
